<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIGHT — 35 ElGhaly</title>
  <meta name="description" content="Classify a Solana signature. No connect. No seed. No screen share." />
  <meta name="theme-color" content="#0b0418" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#07010f; --ink:#f5f7ff; --dim:#b9b6d3; --purple:#9945ff; --green:#14f195; --cyan:#19fbff; --line:rgba(153,69,255,.28); --card:rgba(20,6,39,.72); --a:#14f195; --b:#f5d76e; --c:#ff6b8a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:var(--ink); }
    body { font-family:ui-sans-serif,system-ui,sans-serif; line-height:1.5; min-height:100vh; background: radial-gradient(900px 480px at 10% -10%, rgba(153,69,255,.28), transparent 55%), radial-gradient(700px 400px at 100% 0%, rgba(20,241,149,.12), transparent 50%), var(--bg); }
    .wrap { max-width:920px; margin:0 auto; padding:28px 20px 80px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .mark { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--purple),var(--green)); display:grid; place-items:center; font-weight:800; }
    .word { font-size:13px; letter-spacing:.32em; text-transform:uppercase; color:var(--dim); }
    .lang { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:280px; }
    .lang button { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:5px 9px; font-size:11px; cursor:pointer; }
    .lang button.on { color:#07010f; background:var(--green); border-color:var(--green); }
    .kicker { color:var(--green); font-size:12px; letter-spacing:.18em; text-transform:uppercase; margin-top:28px; }
    h1 { font-size:42px; letter-spacing:-.04em; margin:8px 0 10px; }
    .lede { font-size:18px; color:var(--dim); max-width:34em; }
    .cta { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    .cta a, button.go, button.ghost { text-decoration:none; border-radius:999px; padding:12px 16px; font-size:14px; font-weight:600; border:0; cursor:pointer; font-family:inherit; }
    .primary, button.go { background:var(--green); color:#04110a; }
    .ghost, button.ghost { border:1px solid var(--line); color:var(--ink); background:transparent; }
    .box { margin-top:28px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; }
    label { display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--purple); margin-bottom:8px; }
    textarea { width:100%; min-height:92px; resize:vertical; background:#11041f; color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:28px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; }
    .card h3 { font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--green); margin-bottom:8px; }
    .card p, p, li { color:var(--dim); font-size:15px; }
    section { margin-top:36px; }
    h2 { font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--purple); margin-bottom:12px; }
    .rule { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink); background:#11041f; border:1px solid var(--line); border-radius:14px; padding:16px 18px; white-space:pre-wrap; }
    .out { margin-top:14px; display:none; }
    .out.on { display:block; }
    .badge { display:inline-block; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; letter-spacing:.12em; }
    .A { background:rgba(20,241,149,.16); color:var(--a); }
    .B { background:rgba(245,215,110,.16); color:var(--b); }
    .C { background:rgba(255,107,138,.16); color:var(--c); }
    .X { background:rgba(185,182,211,.12); color:var(--dim); }
    footer { margin-top:48px; color:var(--dim); font-size:13px; }
    a { color:var(--cyan); }
    @media (max-width:720px){ .grid{grid-template-columns:1fr;} .lang{max-width:100%;} h1{font-size:32px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/"><div class="mark">35</div><span class="word">elghaly</span></a>
      <div class="lang" id="langbar"></div>
    </header>
    <p class="kicker" data-i18n="kicker"></p>
    <h1>SIGHT</h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="cta">
      <a class="ghost" href="mailto:support@elghaly.dev?subject=HUMAN%20SIGHT" data-i18n="human"></a>
      <a class="ghost" href="mailto:support@elghaly.dev?subject=SIGHT%20PAY" data-i18n="pay"></a>
      <a class="ghost" href="https://github.com/Alarm2024/35-sight">GitHub</a>
    </div>
    <div class="box">
      <label for="q" data-i18n="paste"></label>
      <textarea id="q" spellcheck="false" autocomplete="off"></textarea>
      <div class="row">
        <button class="go" id="run" type="button" data-i18n="run"></button>
        <button class="ghost" id="clr" type="button" data-i18n="clr"></button>
      </div>
      <div class="out" id="out">
        <p><span class="badge X" id="badge">—</span></p>
        <p class="rule" id="report"></p>
      </div>
    </div>
    <div class="grid">
      <article class="card"><h3>A</h3><p data-i18n="c1p"></p></article>
      <article class="card"><h3>B</h3><p data-i18n="c2p"></p></article>
      <article class="card"><h3>C</h3><p data-i18n="c3p"></p></article>
    </div>
    <section>
      <h2 data-i18n="never"></h2>
      <p class="rule" data-i18n="neverp"></p>
    </section>
    <section>
      <h2 data-i18n="lanes"></h2>
      <p data-i18n="lanesp"></p>
    </section>
    <footer>✝️ 🪬 🧿 · SIGHT · <a href="mailto:support@elghaly.dev">support@elghaly.dev</a> · <a href="/">35 desk</a></footer>
  </div>
  <script>
    var T = {
      en: { kicker:"Public read · other project from the closed desk", lede:"Paste a Solana signature. SIGHT names the programs and classifies A / B / C. No wallet connect. No seed. You click revoke.", human:"Cannot pay — write HUMAN", pay:"Ask a paid address scan", paste:"Signature only", run:"Classify", clr:"Clear", c1p:"Known program. Finite amount. Counterparty you can name.", c2p:"Token approve at u64::MAX. One signature now, drain later.", c3p:"Unknown program, SetAuthority, or writable token accounts you did not expect.", never:"Never", neverp:"No seed. No private key. No 2FA. No connect-wallet. No remote control. No recovery promise.", lanes:"Lanes", lanesp:"One signature class is free. Full address scan is paid by mail quote in USDC — never to the 35 credit vault. If you cannot pay, mail support@elghaly.dev with subject HUMAN." },
      ru: { kicker:"Публичное чтение · отдельный проект", lede:"Вставьте подпись Solana. SIGHT классифицирует A / B / C. Без connect. Без seed.", human:"Не могу платить — HUMAN", pay:"Платное сканирование адреса", paste:"Только подпись", run:"Классифицировать", clr:"Очистить", c1p:"Известная программа. Конечная сумма.", c2p:"Approve на u64::MAX.", c3p:"Неизвестная программа или SetAuthority.", never:"Никогда", neverp:"Ни seed, ни ключ, ни 2FA, ни connect, ни удалённый доступ.", lanes:"Потоки", lanesp:"Одна подпись бесплатно. Скан адреса — по письму. Кто не может платить: тема HUMAN." },
      zh: { kicker:"公开读取 · 独立项目", lede:"粘贴 Solana 签名。SIGHT 分为 A / B / C。不连接钱包。不要种子。", human:"无法付费 — 写 HUMAN", pay:"付费地址扫描", paste:"仅签名", run:"分类", clr:"清除", c1p:"已知程序，有限金额。", c2p:"无限授权 u64::MAX。", c3p:"未知程序或 SetAuthority。", never:"禁止", neverp:"不要助记词、私钥、2FA、连接钱包或远程控制。", lanes:"通道", lanesp:"一条签名免费。地址扫描付费。无法支付请邮件主题 HUMAN。" },
      de: { kicker:"Öffentliches Lesen · eigenes Projekt", lede:"Solana-Signatur einfügen. SIGHT klassifiziert A / B / C. Kein Connect. Kein Seed.", human:"Kein Geld — HUMAN schreiben", pay:"Bezahlter Adress-Scan", paste:"Nur Signatur", run:"Klassifizieren", clr:"Leeren", c1p:"Bekanntes Programm. Endlicher Betrag.", c2p:"Approve auf u64::MAX.", c3p:"Unbekanntes Programm oder SetAuthority.", never:"Nie", neverp:"Kein Seed, kein Key, kein 2FA, kein Connect, kein Remote.", lanes:"Spuren", lanesp:"Eine Signatur gratis. Adress-Scan per Mail. Kein Geld: Betreff HUMAN." },
      es: { kicker:"Lectura pública · otro proyecto", lede:"Pega una firma Solana. SIGHT clasifica A / B / C. Sin connect. Sin seed.", human:"No puedo pagar — HUMAN", pay:"Escaneo de dirección de pago", paste:"Solo firma", run:"Clasificar", clr:"Borrar", c1p:"Programa conocido. Monto finito.", c2p:"Approve en u64::MAX.", c3p:"Programa desconocido o SetAuthority.", never:"Nunca", neverp:"Ni seed, ni clave, ni 2FA, ni connect, ni control remoto.", lanes:"Vías", lanesp:"Una firma es gratis. El escaneo de dirección se cotiza por correo. Sin pago: asunto HUMAN." }
    };
    var LANGS = ["en","ru","zh","de","es"];
    var LABELS = { en:"EN", ru:"RU", zh:"中文", de:"DE", es:"ES" };
    function applyLang(lang) {
      if (!T[lang]) lang = "en";
      document.documentElement.lang = lang;
      var pack = T[lang];
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var k = el.getAttribute("data-i18n"); if (pack[k]) el.textContent = pack[k];
      });
      document.querySelectorAll("#langbar button").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-lang") === lang);
      });
      var q = document.getElementById("q");
      q.placeholder = pack.paste + " · base58";
      try { localStorage.setItem("35-lang", lang); } catch (e) {}
    }
    var bar = document.getElementById("langbar");
    LANGS.forEach(function (code) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("data-lang", code); b.textContent = LABELS[code];
      b.onclick = function () { applyLang(code); }; bar.appendChild(b);
    });
    try { applyLang(localStorage.getItem("35-lang") || "en"); } catch (e) { applyLang("en"); }

    var ALLOW = {
      "11111111111111111111111111111111": "System",
      "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA": "SPL Token",
      "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb": "Token-2022",
      "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL": "ATA",
      "ComputeBudget111111111111111111111111111111": "ComputeBudget",
      "MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr": "Memo",
      "Memo1UhkJRFHyiPbp35YhVUfNiLBkx7txu1Eh6iGXoW": "MemoLegacy"
    };
    var MAX = "18446744073709551615";
    var RPCS = [
      "https://api.mainnet-beta.solana.com",
      "https://solana-rpc.publicnode.com"
    ];

    function looksSecret(s) {
      var t = s.trim();
      if (/\b(\w+\s+){11,23}\w+\b/.test(t) && t.split(/\s+/).length <= 24) return true;
      if (/^\s*\[[\d,\s]{80,}\]\s*$/.test(t)) return true;
      if (/^[1-9A-HJ-NP-Za-km-z]{86,88}$/.test(t)) return true;
      return false;
    }
    function looksSig(s) {
      return /^[1-9A-HJ-NP-Za-km-z]{64,88}$/.test(s.trim());
    }
    function ixList(tx) {
      var msg = tx.transaction.message;
      var outer = msg.instructions || [];
      var inner = [];
      (tx.meta && tx.meta.innerInstructions || []).forEach(function (g) {
        (g.instructions || []).forEach(function (ix) { inner.push(ix); });
      });
      return outer.concat(inner);
    }
    function pidOf(ix) { return ix.programId || ix.programIdIndex || ""; }
    function classify(tx) {
      var ixs = ixList(tx);
      var programs = [];
      var notes = [];
      var cls = "A";
      ixs.forEach(function (ix) {
        var pid = String(pidOf(ix));
        var name = ALLOW[pid] || "UNKNOWN";
        if (programs.indexOf(name === "UNKNOWN" ? pid : name) < 0) {
          programs.push(name === "UNKNOWN" ? pid.slice(0, 8) + "…" : name);
        }
        if (!ALLOW[pid] && pid.length > 20) {
          cls = "C";
          notes.push("unknown program " + pid);
        }
        var parsed = ix.parsed || null;
        var typ = parsed && parsed.type ? parsed.type : "";
        var info = parsed && parsed.info ? parsed.info : {};
        var amt = info.amount || info.lamports || info.tokenAmount && info.tokenAmount.amount;
        if (typ === "approve" || typ === "approveChecked") {
          if (String(amt) === MAX) {
            if (cls !== "C") cls = "B";
            notes.push("unlimited approve → delegate " + (info.delegate || "?"));
          } else {
            notes.push("finite approve " + amt + " → " + (info.delegate || "?"));
          }
        }
        if (typ === "setAuthority" || typ === "setAuthorityChecked") {
          cls = "C";
          notes.push("SetAuthority " + (info.authorityType || "") + " → " + (info.newAuthority || "?"));
        }
        if (typ === "closeAccount") {
          if (cls !== "C") cls = "B";
          notes.push("closeAccount");
        }
        if (typ === "transfer" || typ === "transferChecked") {
          notes.push("transfer " + (amt || "") + " → " + (info.destination || "?"));
        }
      });
      if (!ixs.length) { cls = "C"; notes.push("no instructions readable"); }
      return { cls: cls, programs: programs, notes: notes };
    }
    function show(cls, text) {
      var out = document.getElementById("out");
      var badge = document.getElementById("badge");
      var report = document.getElementById("report");
      out.classList.add("on");
      badge.className = "badge " + cls;
      badge.textContent = cls === "X" ? "BLOCKED" : "CLASS " + cls;
      report.textContent = text;
    }
    async function rpcGet(sig) {
      var body = JSON.stringify({ jsonrpc:"2.0", id:1, method:"getTransaction", params:[sig, { encoding:"jsonParsed", maxSupportedTransactionVersion:0 }] });
      var last = null;
      for (var i = 0; i < RPCS.length; i++) {
        try {
          var res = await fetch(RPCS[i], { method:"POST", headers:{ "content-type":"application/json" }, body:body });
          var j = await res.json();
          if (j.result) return j.result;
          last = j.error && j.error.message || "empty result";
        } catch (e) { last = String(e.message || e); }
      }
      throw new Error(last || "rpc failed");
    }
    document.getElementById("run").onclick = async function () {
      var raw = document.getElementById("q").value || "";
      if (looksSecret(raw)) {
        show("X", "Rejected. This looks like a seed or secret. SIGHT never accepts keys. Rotate that secret yourself. Mail support@elghaly.dev only with a public signature.");
        document.getElementById("q").value = "";
        return;
      }
      var sig = raw.trim();
      if (!looksSig(sig)) {
        show("X", "Need a public transaction signature (base58). Not a wallet address in v1. Not a phrase.");
        return;
      }
      show("X", "Reading chain…");
      try {
        var tx = await rpcGet(sig);
        if (!tx) { show("C", "Signature not found on tried public RPCs. Wait for confirmation or paste again."); return; }
        var r = classify(tx);
        var lines = [];
        lines.push("sig " + sig);
        lines.push("programs " + (r.programs.join(", ") || "none"));
        r.notes.forEach(function (n) { lines.push("- " + n); });
        if (r.cls === "A") lines.push("next: optional. Record the program.");
        if (r.cls === "B") lines.push("next: owner revokes the delegate in their own wallet. Do not send the seed.");
        if (r.cls === "C") lines.push("next: do not sign twins of this. Move funds from a wallet YOU created. Mail HUMAN if you cannot pay for a wider scan.");
        show(r.cls, lines.join("\n"));
      } catch (e) {
        show("C", "Could not decode from this browser RPC (" + e.message + "). Open the signature on an explorer you control, or mail support@elghaly.dev with the public signature only.");
      }
    };
    document.getElementById("clr").onclick = function () {
      document.getElementById("q").value = "";
      document.getElementById("out").classList.remove("on");
    };
  </script>
</body>
</html>
